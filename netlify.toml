[build]
  publish = "."

# Protect internal server files and SQLite files from public access on Netlify
[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/db.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test_suite.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tulis.db*"
  to = "/404.html"
  status = 404
  force = true

# Production Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Ensure Service Worker is never aggressively cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Optimized cache for static assets
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
