<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Strona nie znaleziona · Tulis Learn</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #0b110e;
      --card: #131f17;
      --border: #203528;
      --green: #2ecc71;
      --text: #eaf3ed;
      --muted: #8ea195;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 42px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .code {
      font-size: 64px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #1b7a48 0%, #2ecc71 100%);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: transform 0.15s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Nie znaleziono strony</h1>
    <p>Zasób, którego szukasz, nie istnieje lub został przeniesiony. Wróć do platformy, aby kontynuować naukę.</p>
    <a class="btn" href="/">➔ Przejdź do Tulis Learn</a>
  </div>
</body>
</html>
